<rect x="496" y="150" width="5" height="66" fill="#0f766e" clip-path="url(#c-turn)"/>
<text x="514" y="178" font-size="15" font-weight="600" fill="#1f2328">SmartTurn v3.2</text>
<text x="514" y="198" font-size="12.5" fill="#59636e">a ideia terminou?</text>
<g filter="url(#sh)"><rect x="732" y="150" width="200" height="66" rx="10" fill="#6d28d9" stroke="#6d28d9"/></g>
<text x="750" y="178" font-size="15" font-weight="600" fill="#ffffff">Qwen3-Omni Thinker</text>
<text x="750" y="198" font-size="12.5" fill="#ffffff" fill-opacity="0.82">áudio e imagem → texto</text>
<g filter="url(#sh)"><rect x="378" y="330" width="200" height="66" rx="10" fill="#ffffff" stroke="#d1d9e0"/></g>
<rect x="378" y="330" width="5" height="66" fill="#6d28d9" clip-path="url(#c-tts)"/>
<text x="396" y="358" font-size="15" font-weight="600" fill="#1f2328">Qwen3-TTS</text>
<text x="396" y="378" font-size="12.5" fill="#59636e">voz personalizada</text>
<g filter="url(#sh)"><rect x="732" y="330" width="200" height="66" rx="10" fill="#ffffff" stroke="#d1d9e0"/></g>
<rect x="732" y="330" width="5" height="66" fill="#b45309" clip-path="url(#c-parse)"/>
<text x="750" y="358" font-size="15" font-weight="600" fill="#1f2328">Separação da saída</text>
<text x="750" y="378" font-size="12.5" fill="#59636e">texto e tool calls</text>
<g filter="url(#sh)"><rect x="968" y="330" width="200" height="66" rx="10" fill="#ffffff" stroke="#d1d9e0"/></g>
<rect x="968" y="330" width="5" height="66" fill="#1d64d8" clip-path="url(#c-web)"/>
<text x="986" y="358" font-size="15" font-weight="600" fill="#1f2328">Busca web</text>
<text x="986" y="378" font-size="12.5" fill="#59636e">Gemini com Google Search</text>
<g filter="url(#sh)"><rect x="968" y="150" width="200" height="66" rx="10" fill="#ffffff" stroke="#d1d9e0"/></g>
<rect x="968" y="150" width="5" height="66" fill="#b45309" clip-path="url(#c-queue)"/>
