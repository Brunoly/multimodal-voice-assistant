<text x="301" y="355" font-size="12" fill="#59636e" text-anchor="middle">em streaming</text>
<path d="M932 363 H965" fill="none" stroke="#1d64d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-ext)"/>
<path d="M1068 330 V219" fill="none" stroke="#1d64d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-ext)"/>
<text x="1058" y="277" font-size="12" fill="#1d64d8" text-anchor="end">em segundo plano</text>
<path d="M968 183 H935" fill="none" stroke="#1d64d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-ext)"/>
<path d="M764 216 C764 262 596 262 596 221" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-turn)"/>
<text x="680" y="280" font-size="12" fill="#0f766e" text-anchor="middle">fala retomada: descarta e reprocessa</text>
<path d="M330 216 V276 Q330 284 322 284 H132 Q124 284 124 292 V327" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-turn)"/>
<text x="227" y="276" font-size="12" fill="#0f766e" text-anchor="middle">nova fala interrompe</text>
<g filter="url(#sh)"><rect x="24" y="20" width="200" height="66" rx="10" fill="#ffffff" stroke="#d1d9e0"/></g>
<rect x="24" y="20" width="5" height="66" fill="#6e7781" clip-path="url(#c-img)"/>
<text x="42" y="48" font-size="15" font-weight="600" fill="#1f2328">Imagem</text>
<text x="42" y="68" font-size="12.5" fill="#59636e">opcional, vai com o turno</text>
<g filter="url(#sh)"><rect x="24" y="150" width="200" height="66" rx="10" fill="#ffffff" stroke="#d1d9e0"/></g>
<rect x="24" y="150" width="5" height="66" fill="#6e7781" clip-path="url(#c-mic)"/>
<text x="42" y="178" font-size="15" font-weight="600" fill="#1f2328">Microfone</text>
<text x="42" y="198" font-size="12.5" fill="#59636e">captura contínua</text>
<g filter="url(#sh)"><rect x="24" y="330" width="200" height="66" rx="10" fill="#ffffff" stroke="#d1d9e0"/></g>
<rect x="24" y="330" width="5" height="66" fill="#6e7781" clip-path="url(#c-audio)"/>
<text x="42" y="358" font-size="15" font-weight="600" fill="#1f2328">Áudio progressivo</text>
<text x="42" y="378" font-size="12.5" fill="#59636e">toca enquanto é gerado</text>
<g filter="url(#sh)"><rect x="260" y="150" width="200" height="66" rx="10" fill="#ffffff" stroke="#d1d9e0"/></g>
