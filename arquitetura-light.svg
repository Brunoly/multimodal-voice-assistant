<path d="M832 216 V327" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-edge)"/>
<path d="M732 363 H581" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-edge)"/>
<text x="655" y="355" font-size="12" fill="#59636e" text-anchor="middle">só o texto</text>
