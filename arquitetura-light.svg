<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1192 476" width="1192" height="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Arquitetura do assistente multimodal por voz</title>
<desc id="desc">Microfone, Silero VAD e SmartTurn alimentam o Qwen3-Omni, que também recebe a imagem opcional. A saída é separada em texto, sintetizado pelo Qwen3-TTS e tocado progressivamente, e em chamadas de busca web, cujo resultado volta ao Qwen3-Omni quando a conversa está livre. Fala retomada descarta a resposta especulativa; nova fala interrompe o áudio.</desc>
<defs>
<marker id="a-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 L2.6,5 z" fill="#8c959f"/></marker>
<marker id="a-turn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 L2.6,5 z" fill="#0f766e"/></marker>
<marker id="a-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 L2.6,5 z" fill="#1d64d8"/></marker>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1f2328" flood-opacity="0.07"/></filter>
<clipPath id="c-img"><rect x="24" y="20" width="200" height="66" rx="10"/></clipPath>
<clipPath id="c-mic"><rect x="24" y="150" width="200" height="66" rx="10"/></clipPath>
<clipPath id="c-audio"><rect x="24" y="330" width="200" height="66" rx="10"/></clipPath>
<clipPath id="c-vad"><rect x="260" y="150" width="200" height="66" rx="10"/></clipPath>
<clipPath id="c-turn"><rect x="496" y="150" width="200" height="66" rx="10"/></clipPath>
<clipPath id="c-omni"><rect x="732" y="150" width="200" height="66" rx="10"/></clipPath>
<clipPath id="c-tts"><rect x="378" y="330" width="200" height="66" rx="10"/></clipPath>
<clipPath id="c-parse"><rect x="732" y="330" width="200" height="66" rx="10"/></clipPath>
<clipPath id="c-web"><rect x="968" y="330" width="200" height="66" rx="10"/></clipPath>
<clipPath id="c-queue"><rect x="968" y="150" width="200" height="66" rx="10"/></clipPath>
</defs>
<path d="M224 53 H820 Q832 53 832 65 V147" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-edge)"/>
<text x="528" y="45" font-size="12" fill="#59636e" text-anchor="middle">anexada ao áudio do turno</text>
<path d="M224 183 H257" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-edge)"/>
