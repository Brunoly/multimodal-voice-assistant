<path d="M696 183 H729" fill="none" stroke="#656c76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-edge)"/>
<path d="M832 216 V327" fill="none" stroke="#656c76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-edge)"/>
<path d="M732 363 H581" fill="none" stroke="#656c76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-edge)"/>
<text x="655" y="355" font-size="12" fill="#9198a1" text-anchor="middle">só o texto</text>
<path d="M378 363 H227" fill="none" stroke="#656c76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-edge)"/>
<text x="301" y="355" font-size="12" fill="#9198a1" text-anchor="middle">em streaming</text>
<path d="M932 363 H965" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-ext)"/>
<path d="M1068 330 V219" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-ext)"/>
<text x="1058" y="277" font-size="12" fill="#58a6ff" text-anchor="end">em segundo plano</text>
<path d="M968 183 H935" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-ext)"/>
<path d="M764 216 C764 262 596 262 596 221" fill="none" stroke="#2dd4bf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-turn)"/>
<text x="680" y="280" font-size="12" fill="#2dd4bf" text-anchor="middle">fala retomada: descarta e reprocessa</text>
<path d="M330 216 V276 Q330 284 322 284 H132 Q124 284 124 292 V327" fill="none" stroke="#2dd4bf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-turn)"/>
<text x="227" y="276" font-size="12" fill="#2dd4bf" text-anchor="middle">nova fala interrompe</text>
<g filter="url(#sh)"><rect x="24" y="20" width="200" height="66" rx="10" fill="#151b23" stroke="#3d444d"/></g>
<rect x="24" y="20" width="5" height="66" fill="#8b949e" clip-path="url(#c-img)"/>
<text x="42" y="48" font-size="15" font-weight="600" fill="#e6edf3">Imagem</text>
<text x="42" y="68" font-size="12.5" fill="#9198a1">opcional, vai com o turno</text>
<g filter="url(#sh)"><rect x="24" y="150" width="200" height="66" rx="10" fill="#151b23" stroke="#3d444d"/></g>
<rect x="24" y="150" width="5" height="66" fill="#8b949e" clip-path="url(#c-mic)"/>
<text x="42" y="178" font-size="15" font-weight="600" fill="#e6edf3">Microfone</text>
<text x="42" y="198" font-size="12.5" fill="#9198a1">captura contínua</text>
<g filter="url(#sh)"><rect x="24" y="330" width="200" height="66" rx="10" fill="#151b23" stroke="#3d444d"/></g>
<rect x="24" y="330" width="5" height="66" fill="#8b949e" clip-path="url(#c-audio)"/>
<text x="42" y="358" font-size="15" font-weight="600" fill="#e6edf3">Áudio progressivo</text>
<text x="42" y="378" font-size="12.5" fill="#9198a1">toca enquanto é gerado</text>
<g filter="url(#sh)"><rect x="260" y="150" width="200" height="66" rx="10" fill="#151b23" stroke="#3d444d"/></g>
<rect x="260" y="150" width="5" height="66" fill="#2dd4bf" clip-path="url(#c-vad)"/>
