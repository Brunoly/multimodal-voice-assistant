<g filter="url(#sh)"><rect x="496" y="150" width="200" height="66" rx="10" fill="#151b23" stroke="#3d444d"/></g>
<rect x="496" y="150" width="5" height="66" fill="#2dd4bf" clip-path="url(#c-turn)"/>
<text x="514" y="178" font-size="15" font-weight="600" fill="#e6edf3">SmartTurn v3.2</text>
<text x="514" y="198" font-size="12.5" fill="#9198a1">a ideia terminou?</text>
<g filter="url(#sh)"><rect x="732" y="150" width="200" height="66" rx="10" fill="#8b5cf6" stroke="#8b5cf6"/></g>
<text x="750" y="178" font-size="15" font-weight="600" fill="#ffffff">Qwen3-Omni Thinker</text>
<text x="750" y="198" font-size="12.5" fill="#ffffff" fill-opacity="0.82">áudio e imagem → texto</text>
<g filter="url(#sh)"><rect x="378" y="330" width="200" height="66" rx="10" fill="#151b23" stroke="#3d444d"/></g>
<rect x="378" y="330" width="5" height="66" fill="#8b5cf6" clip-path="url(#c-tts)"/>
<text x="396" y="358" font-size="15" font-weight="600" fill="#e6edf3">Qwen3-TTS</text>
<text x="396" y="378" font-size="12.5" fill="#9198a1">voz personalizada</text>
<g filter="url(#sh)"><rect x="732" y="330" width="200" height="66" rx="10" fill="#151b23" stroke="#3d444d"/></g>
<rect x="732" y="330" width="5" height="66" fill="#f5b83d" clip-path="url(#c-parse)"/>
<text x="750" y="358" font-size="15" font-weight="600" fill="#e6edf3">Separação da saída</text>
<text x="750" y="378" font-size="12.5" fill="#9198a1">texto e tool calls</text>
<g filter="url(#sh)"><rect x="968" y="330" width="200" height="66" rx="10" fill="#151b23" stroke="#3d444d"/></g>
<rect x="968" y="330" width="5" height="66" fill="#58a6ff" clip-path="url(#c-web)"/>
<text x="986" y="358" font-size="15" font-weight="600" fill="#e6edf3">Busca web</text>
<text x="986" y="378" font-size="12.5" fill="#9198a1">Gemini com Google Search</text>
<g filter="url(#sh)"><rect x="968" y="150" width="200" height="66" rx="10" fill="#151b23" stroke="#3d444d"/></g>
<rect x="968" y="150" width="5" height="66" fill="#f5b83d" clip-path="url(#c-queue)"/>
<text x="986" y="178" font-size="15" font-weight="600" fill="#e6edf3">Resultado em espera</text>
